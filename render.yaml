services:
  - type: web
    name: kashmir-birds-ai
    env: python
    plan: free
    # The Django project lives in website/ (manage.py, requirements.txt).
    rootDir: website
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py import_birds && python manage.py sync_local_names && python manage.py download_model"
    startCommand: "gunicorn website.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 300"
    # One worker, not two: the free tier has 512 MB RAM, and each
    # worker loads Django plus the 200 MB ONNX model in ONNX Runtime.
    # Two workers risked running out of memory. Both model files
    # (model.onnx, 1.2 MB, and model.onnx.data, 200 MB) are
    # downloaded by `download_model` in the build above, from the
    # public Hugging Face model repo yawarnazir/kashmir-birds-v2-onnx
    # -- neither is committed to the repo (see birds/identifier.py).
    # The download pins a specific Hugging Face revision and checks
    # each file against its SHA-256 hash before installing it. That
    # build-time download is best-effort and never fails the build:
    # if it cannot fetch the model, the deploy still goes ahead and
    # the site downloads it at runtime in a background thread with
    # resume (identifier.py). Timeout is 300 s so a slow first
    # inference on a cold worker is not killed mid-request.
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Pin Python 3.12: Render defaults to 3.14, which psycopg-binary
      # 3.2.1 has no version for (first build failed on this). This
      # matches the PYTHON_VERSION=3.12.0 already set in the dashboard.
      - key: PYTHON_VERSION
        value: "3.12.0"
      # DATABASE_URL is set in the Render dashboard (Neon Postgres
      # project "birds-of-paradise") -- it is NOT declared here.
      # Do NOT add a database to this blueprint: that would point
      # the live site at a fresh empty database and lose all user
      # accounts and contact messages. If the service is ever
      # recreated, re-attach the same DATABASE_URL in the dashboard.
      # The build runs `import_birds` to refresh every record in
      # place from the corrected info.json files, then
      # `sync_local_names` as a safety net for the local names.
      # Bird photos are served from bird_database/ via /bird-images/;
      # nothing is copied into media/ at build time.
