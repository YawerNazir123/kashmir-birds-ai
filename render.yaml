services:
  - type: web
    name: kashmir-birds-ai
    env: python
    plan: free
    # The Django project lives in website/ (manage.py, requirements.txt).
    rootDir: website
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py import_birds && python manage.py sync_local_names && python manage.py download_model"
    startCommand: "gunicorn website.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 300"
    # One worker, not two: the free tier has 512 MB RAM, and each
    # worker loads Django plus the 57 MB ONNX model in ONNX Runtime.
    # Two workers risked running out of memory. The model file itself
    # is downloaded by `download_model` in the build above, from the
    # public Kaggle dataset yawarnazir/kashmir-birds-model-onnx -- it
    # is not committed to the repo (see birds/identifier.py). That
    # build-time download is best-effort and never fails the build:
    # if it cannot fetch the model, the deploy still goes ahead and
    # the site downloads it at runtime in a background thread with
    # resume (identifier.py). Timeout is 300 s so a slow first
    # inference on a cold worker is not killed mid-request.
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Pin Python 3.12: Render defaults to 3.14, which psycopg-binary
      # 3.2.1 has no version for (first build failed on this). This
      # matches the PYTHON_VERSION=3.12.0 already set in the dashboard.
      - key: PYTHON_VERSION
        value: "3.12.0"
      # No DATABASE_URL: the site uses SQLite. The committed
      # db.sqlite3 is only a starting snapshot -- it predates the
      # metadata fixes, so the build runs `import_birds` to refresh
      # every record in place from the corrected info.json files
      # (698 updated, 46 created, 26 stale rows pruned in the
      # 2026-10-25 dry run), then `sync_local_names` as a safety
      # net for the local names. This runs on every deploy because
      # Render's filesystem is ephemeral: the refreshed database
      # only exists on the deployed instance, and the next deploy
      # starts again from the committed snapshot. The import
      # re-copies ~3,448 images into media/ each build, so builds
      # take several minutes longer.
      # To switch to Postgres later, add a Render Postgres database and
      # set DATABASE_URL to it -- settings.py picks it up automatically.
