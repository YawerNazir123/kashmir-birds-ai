# TEMPORARY probe: why did run #4 stall at 375/840?
# Run #4's iNaturalist lane finished (~375 files) but the Wikimedia lane
# made ZERO progress in 4+ minutes. This probe tests, from the runner,
# whether upload.wikimedia.org / thumb.wikimedia.org are reachable at all
# and how slow they are, vs iNaturalist S3. No checkout, no commits,
# no pushes — it only prints timings and removes itself.
# NOTE: no `| head` and no pipefail anywhere.
name: Probe Wikimedia reachability

on:
  push:
    paths:
      - .github/workflows/probe-wikimedia.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Probe hosts from the runner
        run: |
          set -eu
          echo "=== DNS ==="
          getent hosts upload.wikimedia.org || echo "DNS upload.wikimedia.org FAILED"
          getent hosts thumb.wikimedia.org || echo "DNS thumb.wikimedia.org FAILED"
          getent hosts inaturalist-open-data.s3.amazonaws.com || echo "DNS inat FAILED"
          echo "=== upload.wikimedia.org (originals) ==="
          for u in \
            "https://upload.wikimedia.org/wikipedia/commons/0/0b/250_Arctic_Tern_restored.jpg" \
            "https://upload.wikimedia.org/wikipedia/commons/4/4c/Arctic_tern_%28Sterna_paradisaea%29_2023_2.jpg" \
            "https://upload.wikimedia.org/wikipedia/commons/3/31/Sibirionetta_formosa_01.jpg" ; do
            echo "-- $u"
            curl -fLs -o /dev/null -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" --max-time 30 --connect-timeout 10 -A "KashmirBirdsAI/1.0" "$u" || echo "CURL FAILED rc=$?"
          done
          echo "=== thumb.wikimedia.org ==="
          for u in \
            "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/250_Arctic_Tern_restored.jpg/640px-250_Arctic_Tern_restored.jpg" ; do
            echo "-- $u"
            curl -fLs -o /dev/null -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" --max-time 30 --connect-timeout 10 -A "KashmirBirdsAI/1.0" "$u" || echo "CURL FAILED rc=$?"
          done
          echo "=== inaturalist S3 ==="
          curl -fLs -o /dev/null -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" --max-time 30 --connect-timeout 10 -A "KashmirBirdsAI/1.0" "https://inaturalist-open-data.s3.amazonaws.com/photos/123456789/medium.jpg" || echo "CURL inat FAILED rc=$? (404 expected for fake id, timing is what matters)"
          echo "=== PROBE DONE ==="
      - name: Remove probe workflow
        run: |
          rm -f .github/workflows/probe-wikimedia.yml
          git config user.name "YawerNazir123"
          git config user.email "YawerNazir123@users.noreply.github.com"
          git add -A
          git commit -m "Remove probe workflow" || echo "nothing to commit"
          git push origin main || echo "push skipped"
