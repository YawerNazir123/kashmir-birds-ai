# Temporary workflow: delete the 112 site-only species that the 2026-10-28
# occurrence audit found do NOT occur in Jammu & Kashmir or Ladakh.
# Audit report: workspace/kashmir-birds/work/site-only-audit.md
# The workflow deletes the folders + their rows in the committed
# db.sqlite3 snapshot, commits to main, and removes itself.
name: Delete non-occurring site-only birds

on:
  push:
    paths:
      - .github/workflows/delete-nonoccurring-birds.yml

permissions:
  contents: write

jobs:
  delete-birds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Delete folders and DB rows, commit, self-remove
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, sqlite3
          folders = open('delete-folders.txt').read().split()
          idents = []
          for f in folders:
              p = os.path.join('bird_database', f, 'info.json')
              try:
                  j = json.load(open(p))
                  idents.append((f, (j.get('common_name') or '').strip(), (j.get('scientific_name') or '').strip()))
              except Exception as e:
                  print('WARN: could not read', p, e)
          con = sqlite3.connect('website/db.sqlite3')
          cur = con.cursor()
          deleted_rows = 0
          for folder, common, sci in idents:
              if sci:
                  cur.execute("DELETE FROM birds_bird WHERE lower(scientific_name) = lower(?)", (sci,))
                  deleted_rows += cur.rowcount
              if common:
                  cur.execute("DELETE FROM birds_bird WHERE lower(common_name) = lower(?)", (common,))
                  deleted_rows += cur.rowcount
          con.commit()
          print('DB rows deleted:', deleted_rows)
          print('birds left in snapshot:', cur.execute('SELECT COUNT(*) FROM birds_bird').fetchone()[0])
          con.close()
          PYEOF
          REMOVED=0
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            if [ -d "bird_database/$d" ]; then
              git rm -r -q --ignore-unmatch "bird_database/$d"
              REMOVED=$((REMOVED + 1))
            else
              echo "WARN: folder missing on GitHub: bird_database/$d"
            fi
          done < delete-folders.txt
          echo "folders removed: $REMOVED"
          test "$REMOVED" -ge 100
          rm -f delete-folders.txt audit-probe.txt .github/workflows/delete-nonoccurring-birds.yml
          git config user.name "YawerNazir123"
          git config user.email "YawerNazir123@users.noreply.github.com"
          git add -A
          git commit -m "Delete 112 site-only species that do not occur in J&K/Ladakh (audit 2026-10-28)" -m "Folders removed per workspace/kashmir-birds/work/site-only-audit.md; their rows were also removed from the committed db.sqlite3 snapshot. KEEP 94, QUERY 54 (kept for the user to decide)."
          git push origin main
