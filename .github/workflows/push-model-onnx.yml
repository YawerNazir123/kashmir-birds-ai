# Temporary workflow: commit the bird ID model to main, then remove itself.
# Created via the GitHub web UI because the web upload rejects files over 25 MB.
name: Push bird ID model to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download model.onnx from Kaggle and verify it
        run: |
          set -euo pipefail
          MODEL_URL="https://www.kaggle.com/api/v1/datasets/download/yawarnazir/kashmir-birds-model-onnx/model.onnx"
          EXPECTED_SHA256="6dba10937ef0e48822db261e626845db71d85c7661aec6ad4e074cee0ee5b884"
          EXPECTED_SIZE="56824615"
          curl -L --fail --retry 3 -A "Mozilla/5.0" -o website/birds/model/model.onnx "$MODEL_URL"
          if head -c 2 website/birds/model/model.onnx | grep -q "PK"; then
            echo "Downloaded file is a zip; extracting model.onnx"
            unzip -o website/birds/model/model.onnx model.onnx -d website/birds/model/
          fi
          ACTUAL_SIZE="$(stat -c%s website/birds/model/model.onnx)"
          ACTUAL_SHA256="$(sha256sum website/birds/model/model.onnx | awk '{print $1}')"
          echo "size=$ACTUAL_SIZE sha256=$ACTUAL_SHA256"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Apply .gitignore change and commit model to main
        run: |
          set -euo pipefail
          grep -qx "website/birds/model/model.onnx" .gitignore
          sed -i '\|^website/birds/model/model\.onnx$|d' .gitignore
          if grep -q "website/birds/model/model.onnx" .gitignore; then
            echo ".gitignore still mentions model.onnx" >&2
            exit 1
          fi
          rm .github/workflows/push-model-onnx.yml
          git config user.name "YawerNazir123"
          git config user.email "YawerNazir123@users.noreply.github.com"
          git add -A
          git status --porcelain
          git diff --cached --stat
          git commit -m "Commit bird ID model (ONNX, 57 MB) into the repo"
          git push origin HEAD:main
