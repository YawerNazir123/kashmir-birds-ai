# Temporary workflow v6: download the photos for the 168 new book-only
# bird species from photo-manifest.json (public CC-licensed URLs),
# ONE chunk at a time, pushing after EACH chunk.
# The info.json files for these species are already on main (snapshot push);
# this workflow only adds the 1.jpg-5.jpg photos.
# NOTE: no `| head` and no pipefail anywhere — a previous workflow died
# on SIGPIPE (exit 141) from `git status | head -20` under pipefail.
#
# WHY v6 — the ROOT CAUSE, proven by probe run 40682566077 (2026-10-28):
# - Wikimedia returns HTTP 429 (Too Many Requests) when a runner's IP
#   requests too fast. curl's built-in --retry HONOURS the Retry-After
#   header, which can be 600 SECONDS (10 minutes) for one file: the probe
#   saw one Azure Tit file take 600.5s total although the transfer itself
#   took 0.38s, and two Naturalis files take 10.2s each on a 429 retry.
#   37 of 40 probe downloads finished in 0.1-1.3s with HTTP 200 — the
#   host is fine; the stall is a single 429 + a 600s forced wait.
# - v4/v5 therefore looked "stuck" at 50/105 or 30/45: a wiki file had hit
#   a 429 and curl was silently waiting out its Retry-After (up to 10 min
#   per file), with no log line while waiting.
# - v6 fixes this two ways:
#   (a) the Wikimedia lane is SEQUENTIAL (1 worker) with a 1.0s delay
#       between requests, so the rate limit is rarely hit at all;
#   (b) curl runs with --retry 0 — NO curl-level retry, so no Retry-After
#       wait can ever happen. Retries are done in Python with short fixed
#       delays (10s, then 30s, max 3 attempts), so the worst case for one
#       file is bounded (~220s) and visible in the log.
# - Chunking is IDENTICAL to v5 (20 chunks, 8-9 species each), so a re-run
#   skips chunks already pushed by v5/v6 (idempotent resume).
# - Per chunk: iNaturalist fast lane (8 workers, S3 never 429s), Wikimedia
#   polite sequential lane, JPEG + distinct-hash verification, then commit
#   + push. A chunk that still fails stops the run cleanly (exit 1) after
#   printing its failures; everything pushed so far stays on main.
name: Add photos for new book-only bird species

on:
  push:
    paths:
      - .github/workflows/add-new-bird-photos.yml

permissions:
  contents: write

jobs:
  upload-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download and push photos, one chunk at a time
        run: |
          set -eu
          git config user.name "YawerNazir123"
          git config user.email "YawerNazir123@users.noreply.github.com"
          python3 -u - <<'PYEOF'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import threading
          import time
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urlparse

          def run(cmd, **kw):
              r = subprocess.run(cmd, capture_output=True, text=True, **kw)
              if r.returncode != 0:
                  print('COMMAND FAILED:', ' '.join(cmd), flush=True)
                  print(r.stdout[-2000:], flush=True)
                  print(r.stderr[-2000:], flush=True)
                  sys.exit(1)
              return r

          manifest = json.load(open('photo-manifest.json'))
          folders = sorted(set(e['folder'] for e in manifest))
          # 20 chunks: first 8 get 9 folders, remaining 12 get 8 folders.
          # (Identical to v5, so re-runs resume where v5/v6 left off.)
          sizes = [9] * 8 + [8] * 12
          chunks = []
          off = 0
          for s in sizes:
              chunks.append(folders[off:off + s])
              off += s
          assert len(chunks) == 20 and sum(len(c) for c in chunks) == 168

          def is_wiki(url):
              return 'wikimedia.org' in urlparse(url).netloc

          def curl_fetch(entry, timeout):
              """One attempt, no curl-level retry (so no Retry-After wait).
              Returns (ok, error_text)."""
              dest = os.path.join('bird_database', entry['folder'],
                                  entry['file'])
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              r = subprocess.run(
                  ['curl', '-fL', '--retry', '0',
                   '--max-time', str(timeout), '--connect-timeout', '15',
                   '-A', 'KashmirBirdsAI/1.0',
                   '-o', dest, entry['url']],
                  capture_output=True, text=True)
              if r.returncode != 0:
                  return False, r.stderr.strip()[-200:]
              with open(dest, 'rb') as fh:
                  head = fh.read(3)
              if head != b'\xff\xd8\xff':
                  os.remove(dest)
                  return False, 'not a JPEG'
              return True, ''

          for ci, my_folders in enumerate(chunks):
              folder_set = set(my_folders)
              entries = [e for e in manifest if e['folder'] in folder_set]
              # Skip chunks already fully on main (re-runs resume here).
              missing = [e for e in entries if not os.path.exists(
                  os.path.join('bird_database', e['folder'], e['file']))]
              if not missing:
                  print('chunk', ci, 'already on main, skipping',
                        flush=True)
                  continue
              print('chunk', ci, 'folders:', len(my_folders),
                    'files:', len(entries), 'missing:', len(missing),
                    flush=True)
              wiki = [e for e in missing if is_wiki(e['url'])]
              inat = [e for e in missing if not is_wiki(e['url'])]
              failed = []
              failed_lock = threading.Lock()
              done = 0
              done_lock = threading.Lock()

              def fetch_inat(entry):
                  global done
                  ok, err = curl_fetch(entry, 30)
                  if not ok:
                      with failed_lock:
                          failed.append((entry['folder'], entry['file'],
                                         entry['url'], err))
                      return
                  with done_lock:
                      done += 1
                      if done % 10 == 0:
                          print('chunk', ci, 'downloaded', done, 'of',
                                len(missing), flush=True)

              # Fast lane: iNaturalist S3 tolerates parallelism.
              with ThreadPoolExecutor(max_workers=8) as pool:
                  list(pool.map(fetch_inat, inat))

              # Polite lane: Wikimedia 429s on parallel load, and curl's
              # built-in retry waits out Retry-After (up to 600s). So:
              # ONE worker, 1.0s between requests, retries handled here
              # with short fixed delays (10s, 30s) — never a 600s wait.
              for e in wiki:
                  ok, err = curl_fetch(e, 60)
                  if ok:
                      with done_lock:
                          done += 1
                          if done % 10 == 0:
                              print('chunk', ci, 'downloaded', done, 'of',
                                    len(missing), flush=True)
                      time.sleep(1.0)
                      continue
                  print('chunk', ci, 'wiki 429/timeout, retrying:',
                        e['folder'], e['file'], err[:80], flush=True)
                  retried = False
                  for delay in (10, 30):
                      time.sleep(delay)
                      ok, err = curl_fetch(e, 60)
                      if ok:
                          retried = True
                          break
                      print('chunk', ci, 'retry failed:',
                            e['folder'], e['file'], err[:80], flush=True)
                  if retried:
                      with done_lock:
                          done += 1
                          if done % 10 == 0:
                              print('chunk', ci, 'downloaded', done, 'of',
                                    len(missing), flush=True)
                      time.sleep(1.0)
                  else:
                      with failed_lock:
                          failed.append((e['folder'], e['file'], e['url'],
                                         err))

              # distinct hashes per folder
              for folder in my_folders:
                  seen = {}
                  for e in sorted([x for x in entries
                                   if x['folder'] == folder],
                                  key=lambda x: x['file']):
                      dest = os.path.join('bird_database', folder,
                                          e['file'])
                      if not os.path.exists(dest):
                          continue
                      h = hashlib.md5(open(dest, 'rb').read()).hexdigest()
                      if h in seen:
                          failed.append((folder, e['file'], e['url'],
                                         'duplicate of ' + seen[h]))
                      seen[h] = e['file']

              still_missing = [e for e in entries if not os.path.exists(
                  os.path.join('bird_database', e['folder'], e['file']))]
              if failed or still_missing:
                  print('chunk', ci, 'FAILED: failures:', len(failed),
                        'missing:', len(still_missing), flush=True)
                  for f in failed:
                      print(' ', f, flush=True)
                  for e in still_missing:
                      print('  missing:', e['folder'], e['file'],
                            flush=True)
                  sys.exit(1)
              print('chunk', ci, 'downloaded OK:', len(entries), 'of',
                    len(entries), flush=True)

              # Push this chunk now — progress is saved on main.
              for folder in my_folders:
                  run(['git', 'add', os.path.join('bird_database', folder)])
              run(['git', 'commit', '-m',
                   'Add photos for 168 new book-only bird species '
                   '(chunk %d/20, %d species)' % (ci + 1, len(my_folders))])
              run(['git', 'pull', '--rebase', 'origin', 'main'])
              run(['git', 'push', 'origin', 'main'])
              print('chunk', ci, 'PUSHED', flush=True)

          # Final check + self-removal.
          all_missing = [e for e in manifest if not os.path.exists(
              os.path.join('bird_database', e['folder'], e['file']))]
          print('total files:', len(manifest),
                'missing:', len(all_missing), flush=True)
          if all_missing:
              print('NOT ALL PHOTOS PRESENT — not removing workflow',
                    flush=True)
              sys.exit(1)
          os.remove('photo-manifest.json')
          os.remove('.github/workflows/add-new-bird-photos.yml')
          if os.path.exists('.github/workflows/probe-wikimedia.yml'):
              os.remove('.github/workflows/probe-wikimedia.yml')
          if os.path.exists('.github/workflows/probe-wikimedia-v2.yml'):
              os.remove('.github/workflows/probe-wikimedia-v2.yml')
          run(['git', 'add', '-A'])
          run(['git', 'commit', '-m',
               'Remove photo manifest and workflow (all 840 photos added)'])
          run(['git', 'pull', '--rebase', 'origin', 'main'])
          run(['git', 'push', 'origin', 'main'])
          print('ALL 840 PHOTOS ADDED AND PUSHED', flush=True)
          PYEOF
