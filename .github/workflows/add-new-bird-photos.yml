# Temporary workflow: download the photos for the 168 new book-only
# bird species from photo-manifest.json (public CC-licensed URLs),
# commit them, and remove itself.
# The info.json files for these species are already on main (snapshot push);
# this workflow only adds the 1.jpg-5.jpg photos.
# NOTE: no `| head` and no pipefail anywhere — a previous workflow died
# on SIGPIPE (exit 141) from `git status | head -20` under pipefail.
#
# FIX v3 — why v1/v2 were slow (measured 2026-10-28, not guessed):
# - v1 (sequential, no timeout) hung 25+ min on stalled downloads.
# - v2 (8 parallel workers, 60s timeout) did <50 of 840 in ~6 min.
# - Root cause found by testing all 840 URLs: Wikimedia (462 of 840
#   URLs: upload.wikimedia.org + thumb.wikimedia.org) THROTTLES many
#   parallel connections from one IP. 32 workers at once -> 360 of 840
#   failed outright; the same URLs one-by-one download fine in 0.6-4.7s.
#   iNaturalist S3 (378 URLs) is fast and tolerates parallelism.
# - Proof: 30 Wikimedia files with 3 workers + staggered starts ->
#   13.9s, 0 failures. So this version splits by host: iNaturalist fast
#   lane (16 workers), Wikimedia polite lane (3 workers, staggered
#   starts, 60s timeout for the few 10-30 MB originals), plus one retry
#   pass for anything that still fails. Expected total ~10-15 min.
name: Add photos for new book-only bird species

on:
  push:
    paths:
      - .github/workflows/add-new-bird-photos.yml

permissions:
  contents: write

jobs:
  add-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download photos from manifest, verify, commit, self-remove
        run: |
          set -eu
          python3 -u - <<'PYEOF'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import threading
          import time
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urlparse

          manifest = json.load(open('photo-manifest.json'))
          print('manifest entries:', len(manifest), flush=True)

          def is_wiki(url):
              return 'wikimedia.org' in urlparse(url).netloc

          wiki = [e for e in manifest if is_wiki(e['url'])]
          inat = [e for e in manifest if not is_wiki(e['url'])]
          print('wikimedia:', len(wiki), 'inat/s3:', len(inat), flush=True)

          failed = []
          failed_lock = threading.Lock()
          done = 0
          done_lock = threading.Lock()

          def fetch(entry, timeout, stagger=0.0):
              global done
              if stagger:
                  time.sleep(stagger)
              folder = entry['folder']
              dest = os.path.join('bird_database', folder, entry['file'])
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              r = subprocess.run(
                  ['curl', '-fL', '--retry', '1', '--retry-delay', '5',
                   '--max-time', str(timeout), '--connect-timeout', '15',
                   '-A', 'KashmirBirdsAI/1.0',
                   '-o', dest, entry['url']],
                  capture_output=True, text=True)
              if r.returncode != 0:
                  with failed_lock:
                      failed.append((folder, entry['file'], entry['url'],
                                     r.stderr.strip()[-200:]))
                  return
              with open(dest, 'rb') as fh:
                  head = fh.read(3)
              if head != b'\xff\xd8\xff':
                  with failed_lock:
                      failed.append((folder, entry['file'], entry['url'],
                                     'not a JPEG'))
                  os.remove(dest)
                  return
              with done_lock:
                  done += 1
                  if done % 25 == 0:
                      print('downloaded', done, 'of', len(manifest), flush=True)

          # Fast lane: iNaturalist S3 tolerates parallelism.
          with ThreadPoolExecutor(max_workers=16) as pool:
              list(pool.map(lambda e: fetch(e, 30), inat))

          # Polite lane: Wikimedia throttles parallel connections from one
          # IP, so only 3 workers and staggered starts (0 / 0.3 / 0.6s).
          def fetch_wiki(args):
              i, e = args
              fetch(e, 60, stagger=(i % 3) * 0.3)
          with ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(fetch_wiki, list(enumerate(wiki))))

          # One retry pass for anything that failed (same polite settings).
          if failed:
              retry = [dict(folder=f, file=fn, url=u)
                       for (f, fn, u, _err) in failed]
              print('retrying', len(retry), 'failed downloads', flush=True)
              failed.clear()
              retry_wiki = [e for e in retry if is_wiki(e['url'])]
              retry_inat = [e for e in retry if not is_wiki(e['url'])]
              with ThreadPoolExecutor(max_workers=8) as pool:
                  list(pool.map(lambda e: fetch(e, 30), retry_inat))
              with ThreadPoolExecutor(max_workers=3) as pool:
                  list(pool.map(fetch_wiki, list(enumerate(retry_wiki))))

          # distinct hashes per folder
          by_folder = {}
          for e in manifest:
              by_folder.setdefault(e['folder'], []).append(e)
          for folder, entries in sorted(by_folder.items()):
              seen = {}
              for e in sorted(entries, key=lambda x: x['file']):
                  dest = os.path.join('bird_database', folder, e['file'])
                  if not os.path.exists(dest):
                      continue
                  h = hashlib.md5(open(dest, 'rb').read()).hexdigest()
                  if h in seen:
                      failed.append((folder, e['file'], e['url'],
                                     'duplicate of ' + seen[h]))
                  seen[h] = e['file']

          downloaded = sum(
              1 for folder, entries in by_folder.items() for e in entries
              if os.path.exists(os.path.join('bird_database', folder, e['file'])))
          print('downloaded OK:', downloaded, 'of', len(manifest), flush=True)
          if failed:
              print('FAILURES:', len(failed), flush=True)
              for f in failed:
                  print(' ', f, flush=True)
              sys.exit(1)
          PYEOF
          rm -f photo-manifest.json .github/workflows/add-new-bird-photos.yml
          git config user.name "YawerNazir123"
          git config user.email "YawerNazir123@users.noreply.github.com"
          git add -A
          git commit -m "Add photos for 168 new book-only bird species" -m "Photos downloaded from photo-manifest.json (Wikimedia Commons / iNaturalist, CC0/CC-BY/CC-BY-NC only); each verified as a JPEG with distinct hashes per folder."
          git push origin main
